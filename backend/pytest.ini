[pytest]
DJANGO_SETTINGS_MODULE = commusafe_backend.settings
addopts = -p no:cacheprovider -p no:faker
python_files = tests.py test_*.py *_tests.py
testpaths = tests usuarios incidentes notificaciones panel_web asistente
filterwarnings =
    error
    ignore:.*_UnionGenericAlias.*:DeprecationWarning:google\.genai\.types
