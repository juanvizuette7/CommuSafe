{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}CommuSafe es una plataforma para gestionar seguridad comunitaria, incidentes, avisos y seguimiento operativo en conjuntos residenciales.{% endblock meta_description %}">
    <title>{% block title %}CommuSafe{% endblock title %}</title>
    <link rel="stylesheet" href="{% static 'css/commusafe.css' %}">
    {% block extra_head %}{% endblock extra_head %}
</head>
<body class="bg-surface font-sans text-slate-900">
    {% block body %}{% endblock body %}
</body>
</html>
