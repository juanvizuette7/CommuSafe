<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000"><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#444"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="750" y="41" font-family="Arial" font-size="24" text-anchor="middle" fill="#222222">Vista física: despliegue del sistema CommuSafe</text><rect x="30" y="160" width="300" height="190" fill="white" stroke="#444"/><text x="180" y="187" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«device»</text><text x="180" y="210" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Dispositivo móvil Android</text><rect x="50" y="240" width="260" height="85" fill="white" stroke="#444"/><text x="180" y="265.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«artifact»</text><text x="180" y="288.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Aplicación CommuSafe</text><text x="180" y="311.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Flutter / Android</text><rect x="30" y="470" width="300" height="190" fill="white" stroke="#444"/><text x="180" y="497" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«device»</text><text x="180" y="520" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Equipo del usuario</text><rect x="50" y="550" width="260" height="85" fill="white" stroke="#444"/><text x="180" y="575.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«executionEnvironment»</text><text x="180" y="598.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Navegador web</text><text x="180" y="621.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Panel HTML / CSS / JavaScript</text><rect x="540" y="140" width="470" height="560" fill="white" stroke="#444"/><text x="775" y="167" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«executionEnvironment» Render · servicio web Python</text><text x="775" y="190" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">commusafe.onrender.com · configuración de producción</text><rect x="565" y="230" width="420" height="100" fill="white" stroke="#444"/><text x="775" y="263" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«executionEnvironment»</text><text x="775" y="286" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Gunicorn WSGI · Python 3.11.9</text><text x="775" y="309" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">1 worker gthread / 4 threads</text><rect x="565" y="365" width="420" height="110" fill="white" stroke="#444"/><text x="775" y="403" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«artifact» commusafe_backend.wsgi</text><text x="775" y="426" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Django: API REST + panel web</text><text x="775" y="449" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Usuarios · incidentes · notificaciones · asistente</text><rect x="565" y="540" width="200" height="100" fill="white" stroke="#444"/><text x="665" y="561.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«artifact»</text><text x="665" y="584.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Archivos estáticos</text><text x="665" y="607.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">STATIC_ROOT</text><text x="665" y="630.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">WhiteNoise</text><rect x="785" y="540" width="200" height="100" fill="white" stroke="#444"/><text x="885" y="561.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«artifact»</text><text x="885" y="584.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Evidencias y fotos</text><text x="885" y="607.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">MEDIA_ROOT</text><text x="885" y="630.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Disco local</text><rect x="1190" y="140" width="280" height="130" fill="white" stroke="#444"/><text x="1330" y="176.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«executionEnvironment»</text><text x="1330" y="199.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">PostgreSQL externo</text><text x="1330" y="222.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Neon (según documentación)</text><text x="1330" y="245.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Conexión por DATABASE_URL</text><rect x="1190" y="330" width="280" height="100" fill="white" stroke="#444"/><text x="1330" y="363" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«external service»</text><text x="1330" y="386" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Firebase Cloud Messaging</text><text x="1330" y="409" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Notificaciones push</text><rect x="1190" y="490" width="280" height="100" fill="white" stroke="#444"/><text x="1330" y="523" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«external service»</text><text x="1330" y="546" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Servidor de correo SMTP</text><text x="1330" y="569" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Recuperación de contraseña</text><rect x="1190" y="650" width="280" height="100" fill="white" stroke="#444"/><text x="1330" y="683" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«external service»</text><text x="1330" y="706" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Gemini API</text><text x="1330" y="729" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Respaldo generativo opcional</text><rect x="680" y="780" width="300" height="100" fill="white" stroke="#444"/><text x="830" y="813" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«external service»</text><text x="830" y="836" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">NLP auxiliar opcional</text><text x="830" y="859" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">URL configurable</text><text x="30" y="919.5" font-family="Arial" font-size="16" text-anchor="start" fill="#222222">Alcance: despliegue definido en el repositorio; no constituye una inspección del entorno activo.</text><text x="30" y="940.5" font-family="Arial" font-size="16" text-anchor="start" fill="#222222">Render no declara disco persistente: MEDIA_ROOT puede perderse al reemplazar la instancia.</text><text x="30" y="961.5" font-family="Arial" font-size="16" text-anchor="start" fill="#222222">SMTP y FCM requieren credenciales; las líneas discontinuas indican integraciones opcionales.</text><text x="30" y="982.5" font-family="Arial" font-size="16" text-anchor="start" fill="#222222">El panel web y la API se ejecutan en el mismo backend. El NLP auxiliar no se aprovisiona en render.yaml.</text><polyline points="330,285 540,285" fill="none" stroke="#444"  /><rect x="385" y="235" width="100" height="42" fill="white"/><text x="435" y="250" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">HTTPS / JWT</text><text x="435" y="271" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">API REST</text><polyline points="330,570 430,570 430,455 540,455" fill="none" stroke="#444"  /><rect x="365" y="400" width="140" height="42" fill="white"/><text x="435" y="415" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">HTTPS</text><text x="435" y="436" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">Sesión / cookies</text><polyline points="775,330 775,365" fill="none" stroke="#444"  /><rect x="803" y="330" width="44" height="21" fill="white"/><text x="825" y="345" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">WSGI</text><polyline points="665,475 665,540" fill="none" stroke="#444"  /><rect x="604" y="495" width="92" height="21" fill="white"/><text x="650" y="510" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">WhiteNoise</text><polyline points="885,475 885,540" fill="none" stroke="#444"  /><rect x="803" y="495" width="164" height="21" fill="white"/><text x="885" y="510" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">Lectura / escritura</text><polyline points="1010,205 1190,205" fill="none" stroke="#444"  /><rect x="1058" y="172" width="84" height="21" fill="white"/><text x="1100" y="187" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">SQL / SSL</text><polyline points="1010,380 1190,380" fill="none" stroke="#444"  /><rect x="1042" y="347" width="116" height="21" fill="white"/><text x="1100" y="362" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">HTTPS · envío</text><polyline points="1010,540 1190,540" fill="none" stroke="#444"  /><rect x="1034" y="495" width="132" height="42" fill="white"/><text x="1100" y="510" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">SMTP / TLS</text><text x="1100" y="531" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">587 por defecto</text><polyline points="1010,680 1100,680 1100,700 1190,700" fill="none" stroke="#444" stroke-dasharray="6 4" /><rect x="1074" y="641" width="52" height="21" fill="white"/><text x="1100" y="656" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">HTTPS</text><polyline points="830,700 830,780" fill="none" stroke="#444" stroke-dasharray="6 4" /><rect x="724" y="727" width="212" height="21" fill="white"/><text x="830" y="742" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">HTTP(S) · si se configura</text><polyline points="1470,380 1485,380 1485,95 180,95 180,160" fill="none" stroke="#444"  marker-end="url(#arrow)"/><rect x="554" y="65" width="372" height="21" fill="white"/><text x="740" y="80" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">Entrega de notificaciones push al dispositivo</text></svg>