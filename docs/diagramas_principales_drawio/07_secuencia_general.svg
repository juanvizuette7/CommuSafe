505,340 710,340" fill="none" stroke="#475569" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="477.7" y="319" width="259.6" height="17" fill="white"/><text x="607.5" y="332" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#172033">4. Crear notificaciones e intentar push</text><polyline points="505,385 300,385" fill="none" stroke="#475569" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="311.1" y="364" width="182.8" height="17" fill="white"/><text x="402.5" y="377" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#172033">5. 201 · Reporte registrado</text><polyline points="915,475 300,475" fill="none" stroke="#475569" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="468.1" y="454" width="278.8" height="17" fill="white"/><text x="607.5" y="467" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#172033">6. Solicitar siguiente estado + comentario</text><polyline points="300,520 505,520" fill="none" stroke="#475569" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="256.7" y="499" width="291.6" height="17" fill="white"/><text x="402.5" y="512" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#172033">7. POST /api/incidentes/{id}/cambiar-estado/</text><polyline points="505,565 710,565" fill="none" stroke="#475569" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="429.7" y="544" width="355.6" height="17" fill="white"/><text x="607.5" y="557" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#172033">8. Validar; guardar estado, historial y notificaciones</text><polyline points="505,610 300,610" fill="none" stroke="#475569" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="259.9" y="589" width="285.2" height="17" fill="white"/><text x="402.5" y="602" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#172033">9. 200 · Estado actualizado; push intentado</text><polyline points="1110,705 300,705" fill="none" stroke="#475569" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="591.2" y="684" width="227.60000000000002" height="17" fill="white"/><text x="705" y="697" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#172033">10. Solicitar CERRADO + comentario</text><polyline points="300,750 505,750" fill="none" stroke="#475569" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="288.7" y="729" width="227.60000000000002" height="17" fill="white"/><text x="402.5" y="742" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#172033">11. POST cambiar-estado/ · CERRADO</text><polyline points="505,795 710,795" fill="none" stroke="#475569" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="426.5" y="774" width="362" height="17" fill="white"/><text x="607.5" y="787" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#172033">12. Validar; guardar cierre, historial y notificaciones</text><polyline points="505,835 300,835" fill="none" stroke="#475569" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="259.9" y="814" width="285.2" height="17" fill="white"/><text x="402.5" y="827" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#172033">13. 200 · Cierre registrado; push intentado</text><text x="600" y="37" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#172033">Secuencia de gestión de un incidente</text><rect x="10" y="75" width="170" height="48" rx="8" fill="white" stroke="#333333"/><text x="95" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Reportante</text><rect x="215" y="75" width="170" height="48" rx="8" fill="white" stroke="#333333"/><text x="300" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">App móvil</text><rect x="420" y="75" width="170" height="48" rx="8" fill="white" stroke="#333333"/><text x="505" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Backend Django</text><rect x="625" y="75" width="170" height="48" rx="8" fill="white" stroke="#333333"/><text x="710" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Persistencia</text><rect x="830" y="75" width="170" height="48" rx="8" fill="white" stroke="#333333"/><text x="915" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Vigilante</text><rect x="1025" y="75" width="170" height="48" rx="8" fill="white" stroke="#333333"/><text x="1110" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Administrador</text><rect x="30" y="145" width="1140" height="30" rx="0" fill="white" stroke="#333333"/><text x="600" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Reporte</text><rect x="30" y="415" width="1140" height="30" rx="0" fill="white" stroke="#333333"/><text x="600" y="435" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Atención y resolución</text><rect x="30" y="640" width="1140" height="30" rx="0" fill="white" stroke="#333333"/><text x="600" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Cierre</text><text x="50" y="893" text-anchor="start" font-family="Arial,sans-serif" font-size="14" fill="#172033">Atención: REGISTRADO → EN_PROCESO → RESUELTO; se repite el intercambio para cada cambio.</text><text x="50" y="912" text-anchor="start" font-family="Arial,sans-serif" font-size="14" fill="#172033">El administrador también puede atender y resolver. El fallo de push no impide guardar la notificación.</text></svg>