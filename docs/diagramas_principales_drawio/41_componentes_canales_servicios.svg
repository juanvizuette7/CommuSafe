<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1050" viewBox="0 0 1660 1050"><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#444"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="830" y="43.5" font-family="Arial" font-size="24" text-anchor="middle" fill="#222222">CommuSafe · Componentes: canales y servicios</text><rect x="30" y="230" width="260" height="130" fill="#eaf4ee" stroke="#526170"/><text x="160" y="278" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«component»</text><text x="160" y="301" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">App móvil Flutter</text><text x="160" y="324" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Canal Android</text><rect x="30" y="570" width="300" height="150" fill="#eaf4ee" stroke="#526170"/><text x="180" y="616.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«component»</text><text x="180" y="639.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Interfaz web (navegador)</text><text x="180" y="662.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">HTML / CSS / JavaScript</text><text x="180" y="685.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Generado por Django Templates</text><rect x="490" y="220" width="280" height="150" fill="#eaf4ee" stroke="#526170"/><text x="630" y="266.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«component»</text><text x="630" y="289.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">API REST · DRF</text><text x="630" y="312.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Autenticación JWT</text><text x="630" y="335.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Serializers y permisos por rol</text><rect x="490" y="570" width="280" height="150" fill="#eaf4ee" stroke="#526170"/><text x="630" y="616.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«component»</text><text x="630" y="639.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Vistas web · panel_web</text><text x="630" y="662.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Sesiones Django</text><text x="630" y="685.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Renderizado de plantillas</text><rect x="960" y="380" width="300" height="210" fill="#eaf4ee" stroke="#526170"/><text x="1110" y="433.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«component»</text><text x="1110" y="456.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Dominio (agrupación lógica)</text><text x="1110" y="479.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">usuarios · incidentes</text><text x="1110" y="502.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">notificaciones · asistente</text><text x="1110" y="525.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Modelos y reglas de negocio</text><text x="1110" y="548.5" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">CommuBot: conocimiento local</text><rect x="720" y="770" width="290" height="130" fill="#eaf4ee" stroke="#526170"/><text x="865" y="818" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«database»</text><text x="865" y="841" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">PostgreSQL · producción</text><text x="865" y="864" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Persistencia relacional</text><rect x="1120" y="800" width="340" height="130" fill="#eaf4ee" stroke="#526170"/><text x="1290" y="848" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«storage»</text><text x="1290" y="871" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Archivos multimedia</text><text x="1290" y="894" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">FileSystemStorage / MEDIA_ROOT</text><rect x="960" y="90" width="300" height="130" fill="#eaf4ee" stroke="#526170"/><text x="1110" y="138" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«component» «external»</text><text x="1110" y="161" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Firebase Cloud Messaging</text><text x="1110" y="184" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Notificaciones push</text><rect x="1340" y="230" width="290" height="130" fill="#eaf4ee" stroke="#526170"/><text x="1485" y="278" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«component» «external»</text><text x="1485" y="301" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Servidor SMTP</text><text x="1485" y="324" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Recuperación de contraseña</text><rect x="1340" y="600" width="290" height="130" fill="#eaf4ee" stroke="#526170"/><text x="1485" y="648" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">«component» «external»</text><text x="1485" y="671" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Proveedor IA · Gemini</text><text x="1485" y="694" font-family="Arial" font-size="18" text-anchor="middle" fill="#222222">Respaldo opcional de CommuBot</text><text x="30" y="964.5" font-family="Arial" font-size="16" text-anchor="start" fill="#222222">Flechas discontinuas: dependencia de uso hacia el proveedor; no representan el recorrido de una respuesta.</text><text x="30" y="985.5" font-family="Arial" font-size="16" text-anchor="start" fill="#222222">API, vistas y dominio pertenecen al mismo backend Django. El panel no es un servidor independiente.</text><text x="30" y="1006.5" font-family="Arial" font-size="16" text-anchor="start" fill="#222222">Persistencia mostrada: producción (SQLite se usa en desarrollo). Las fotografías se almacenan fuera de la base de datos.</text><text x="30" y="1027.5" font-family="Arial" font-size="16" text-anchor="start" fill="#222222">CommuBot consulta conocimiento local y puede utilizar Gemini como respaldo generativo.</text><polyline points="290,295 490,295" fill="none" stroke="#444" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="336" y="255" width="108" height="42" fill="white"/><text x="390" y="270" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">HTTPS / REST</text><text x="390" y="291" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">JWT</text><polyline points="330,645 490,645" fill="none" stroke="#444" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="340" y="595" width="140" height="42" fill="white"/><text x="410" y="610" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">HTTPS</text><text x="410" y="631" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">Sesión / cookies</text><polyline points="770,295 850,295 850,420 960,420" fill="none" stroke="#444" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="800" y="250" width="100" height="42" fill="white"/><text x="850" y="265" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">Usa modelos</text><text x="850" y="286" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">y servicios</text><polyline points="770,645 850,645 850,550 960,550" fill="none" stroke="#444" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="800" y="595" width="100" height="42" fill="white"/><text x="850" y="610" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">Usa modelos</text><text x="850" y="631" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">y servicios</text><polyline points="1020,590 1020,690 865,690 865,770" fill="none" stroke="#444" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="882" y="705" width="116" height="21" fill="white"/><text x="940" y="720" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">ORM de Django</text><polyline points="1190,590 1190,760 1290,760 1290,800" fill="none" stroke="#444" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="1220" y="765" width="180" height="21" fill="white"/><text x="1310" y="780" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">API de almacenamiento</text><polyline points="1110,380 1110,220" fill="none" stroke="#444" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="1024" y="285" width="172" height="42" fill="white"/><text x="1110" y="300" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">notificaciones</text><text x="1110" y="321" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">SDK Firebase / HTTPS</text><polyline points="1260,430 1300,430 1300,295 1340,295" fill="none" stroke="#444" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="1364" y="395" width="132" height="42" fill="white"/><text x="1430" y="410" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">Envío de correo</text><text x="1430" y="431" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">SMTP / TLS</text><polyline points="1260,530 1300,530 1300,665 1340,665" fill="none" stroke="#444" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="1370" y="525" width="140" height="42" fill="white"/><text x="1440" y="540" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">asistente</text><text x="1440" y="561" font-family="Arial" font-size="16" text-anchor="middle" fill="#222222">HTTPS · opcional</text></svg>