mily="Arial,sans-serif" font-size="18" fill="#172033">PK id: UUID</text><text x="910" y="650" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172033">FK destinatario_id: UUID</text><text x="910" y="673" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172033">FK incidente_relacionado_id: UUID [NULL]</text><text x="910" y="696" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172033">titulo: VARCHAR(150)</text><text x="910" y="719" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172033">leida: BOOLEAN</text><rect x="900" y="110" width="380" height="180" rx="0" fill="white" stroke="#333333"/><text x="1090" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#172033">asistente_conversacionasistente</text><path d="M900 142h380" stroke="#333333"/><text x="910" y="167" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172033">PK id: UUID</text><text x="910" y="190" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172033">FK usuario_id: UUID</text><text x="910" y="213" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172033">titulo: VARCHAR(90)</text><rect x="900" y="1030" width="380" height="190" rx="0" fill="white" stroke="#333333"/><text x="1090" y="1052" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#172033">asistente_mensajeasistente</text><path d="M900 1062h380" stroke="#333333"/><text x="910" y="1087" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172033">PK id: UUID</text><text x="910" y="1110" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172033">FK conversacion_id: UUID</text><text x="910" y="1133" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172033">rol: VARCHAR(12)</text><text x="910" y="1156" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172033">contenido: TEXT</text><text x="40" y="1284" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172033">PK = primaria; FK = foránea; UK = único. Solo [NULL] admite nulo.</text><text x="40" y="1307" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172033">Selección de tablas y columnas; tipos SQL lógicos, no DDL del motor activo.</text><text x="40" y="1330" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172033">Una cadena vacía en estado_anterior no equivale a NULL.</text><text x="40" y="1353" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172033">imagen almacena una ruta. El máximo de 3 evidencias no es un límite de la FK.</text><text x="40" y="1376" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172033">Se omiten avisos y su tabla M2M, recuperación, auditoría, logs y conocimiento.</text></svg>